[package]
name = "tr-flow"
description = "Crypto derivatives (funding, open interest, basis, liquidations), order flow (book heatmap, footprint, CVD) and prediction markets from free public venue APIs"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
futures = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
