[package]
name = "hyperdesk"
description = "Hyperdesk: a keyboard-driven crypto and markets terminal with GPU charts, derivatives, order flow and Hyperliquid intelligence"
version.workspace = true
edition.workspace = true
default-run = "hyperdesk"

[dependencies]
hd-core.workspace = true
hd-broker.workspace = true
hd-congress.workspace = true
hd-data.workspace = true
hd-flow.workspace = true
hd-chart.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
hd-macos.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"
